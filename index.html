<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldcoin Live Feed Mini-App</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            width: 340px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 1.1rem;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .precio {
            font-size: 3.2rem;
            font-weight: bold;
            color: #56d364;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .timestamp {
            font-size: 0.8rem;
            color: #8b949e;
        }

        /* 💰 SECCIÓN DEL BANNER PUBLICITARIO MONETIZADO */
        .ad-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #30363d;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <!-- 📢 CARTEL DE AUSPICIO PREMIUM (Organic Labs Space Open) -->
    <!-- Este banner invita directamente a los creadores de memecoins o proyectos a contactarte -->
    <div style="width: 340px; margin: 15px auto 0 auto; text-align: center;">
        <a href="https://t.me/+K3X3kajhpa04YTAx" target="_blank" style="text-decoration: none;">
            <div
                style="background-color: #1f293d; border: 1px dashed #388bfd; color: #58a6ff; border-radius: 12px; padding: 12px; font-weight: bold; font-size: 0.8rem; letter-spacing: 0.5px; box-sizing: border-box; cursor: pointer; transition: 0.2s;">
                📢 PUBLICITA TU PROYECTO AQUÍ (COBRO DIARIO) 🚀
            </div>
        </a>
    </div>

    <!-- Contenedor Principal de la Tarjeta Financiera -->
    <div class="container" style="margin-top: 15px;">
        <h1 id="app-title">Oráculo Wld On-Chain by Organic Labs</h1>

        <!-- ================================================================= -->
        <!-- 🛠️ PASO A INYECTADO: Contenedor flex que agrupa el precio y la flecha -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <div id="precio-live" class="precio">--.--</div>
            <span id="tendencia-flecha"
                style="font-size: 2.5rem; font-weight: bold; color: #8b949e; transition: 0.3s;">➔</span>
        </div>
        <!-- ================================================================= -->

        <div id="clock-live" class="timestamp">📡 Sincronizando con el oráculo...</div>


        <!-- 🎯 ESPACIO DE PUBLICIDAD PAGADA (Ad Network Banner Real) -->
        <div class="ad-box">
            <!-- BEGIN AADS AD UNIT 2457498 -->
            <div id="frame"
                style="width: 100%; margin: auto; position: relative; z-index: 99998; display: flex; justify-content: center;">
                <iframe data-aa='2457498' src='https://acceptable.a-ads.com/2457498/?'
                    style='border:0; padding:0; width:320px; height:50px; overflow:hidden; display:block; margin:auto;'></iframe>
            </div>
            <!-- END AADS AD UNIT 2457498 -->
        </div>
    </div>

    <script>
        const precioElemento = document.getElementById('precio-live');
        const relojElemento = document.getElementById('clock-live');
        const tituloElemento = document.getElementById('app-title');

        // 🛠️ PASO B.1 INYECTADO: Variable global para guardar la traza del mercado en memoria
        let precioAnteriorBlockchain = null;

        // DICCIONARIO INTERNACIONAL DE TRADUCCIONES
        const traducciones = {
            es: {
                titulo: "Oráculo Wld On-Chain by Organic Labs",
                sincronizando: "📡 Sincronizando con el servidor en la nube...",
                verificado: "✅ Bloque verificado a las ",
                error: "Falla de enlace con la API REST."
            },
            en: {
                titulo: "Wld On-Chain Oracle by Organic Labs",
                sincronizando: "📡 Syncing with cloud server...",
                verificado: "✅ Block verified at ",
                error: "API REST connection failed."
            }
        };

        // DETECCIÓN AUTOMÁTICA DE IDIOMA NATIVA
        const sistemaIdioma = navigator.language || navigator.userLanguage;
        const idiomaActivo = sistemaIdioma.startsWith('es') ? 'es' : 'en';
        const lang = traducciones[idiomaActivo];

        tituloElemento.innerText = lang.titulo;
        relojElemento.innerText = lang.sincronizando;

        const refrescarPrecioDesdeBackend = async () => {
            try {
                const respuesta = await fetch('https://worldchain-price-oracle.vercel.app/api/precio');

                if (!respuesta.ok) {
                    throw new Error(`HTTP Error ${respuesta.status}`);
                }

                const datos = await respuesta.json();

                if (datos.success) {
                    const precioActual = datos.price;

                    // Pintamos el precio formateado a 6 dígitos nativos
                    precioElemento.innerText = `$${precioActual.toFixed(6)} USD`;
                    precioElemento.style.color = '#56d364';

                    // 🛠️ PASO B.2 INYECTADO: Capturamos la etiqueta de la flecha
                    const flechaElemento = document.getElementById('tendencia-flecha');

                    // Si ya tenemos un precio previo en memoria, ejecutamos el control de auditoría de mercado
                    if (precioAnteriorBlockchain !== null) {
                        if (precioActual > precioAnteriorBlockchain) {
                            // El mercado sube: Flecha verde neón hacia arriba
                            flechaElemento.innerText = "▲";
                            flechaElemento.style.color = "#56d364";
                        } else if (precioActual < precioAnteriorBlockchain) {
                            // El mercado baja: Flecha roja corporativa hacia abajo
                            flechaElemento.innerText = "▼";
                            flechaElemento.style.color = "#f85149";
                        }
                        // Nota Senior: Si el precio es exactamente igual al bloque anterior, 
                        // se mantiene la última tendencia registrada sin mutar el color.
                    }

                    // Guardamos el precio actual en la variable de traza para la comparación del próximo ciclo
                    precioAnteriorBlockchain = precioActual;

                    const horaLocal = new Date(datos.timestamp).toLocaleTimeString();
                    relojElemento.innerText = `${lang.verificado}${horaLocal}`;
                    relojElemento.style.color = '#8b949e';
                } else {
                    throw new Error("Estado fallido.");
                }
            } catch (error) {
                precioElemento.innerText = "❌ ERR";
                precioElemento.style.color = '#f85149';
                relojElemento.innerText = lang.error;
                relojElemento.style.color = '#f85149';
            }
        };

        refrescarPrecioDesdeBackend();
        setInterval(refrescarPrecioDesdeBackend, 5000);
    </script>

</body>

</html>
