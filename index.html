<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldcoin Live Feed Mini-App</title>
    <style>
        /* 🎨 ESTILO PREMIUM TECH - SOBRIO, MINIMALISTA Y DE ALTA VELOCIDAD DE CARGA */
        :root {
            --bg-main: #06090e;
            --bg-card: rgba(22, 27, 34, 0.7);
            --border-color: rgba(48, 54, 61, 0.8);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --brand-blue: #58a6ff;
            --brand-green: #39d353;
            --brand-red: #f85149;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 📢 CARTEL DE SPONSOR SUPERIOR MODERNO */
        .sponsor-box {
            width: 100%;
            max-width: 340px;
            margin-bottom: 20px;
            text-align: center;
        }

        .sponsor-box a {
            text-decoration: none;
            display: block;
        }

        .sponsor-btn {
            background: linear-gradient(135deg, rgba(31, 41, 61, 0.6), rgba(35, 57, 91, 0.4));
            border: 1px dashed var(--brand-blue);
            color: var(--brand-blue);
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-sizing: border-box;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .sponsor-btn:hover {
            background: linear-gradient(135deg, rgba(31, 41, 61, 0.8), rgba(35, 57, 91, 0.6));
            border-style: solid;
            transform: translateY(-1px);
        }

        /* 🏢 CONTENEDOR PRINCIPAL ESTILO CRISTAL (GLASSMORPHISM RESPONSIVO) */
        .container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            width: 92%;
            max-width: 340px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-sizing: border-box;
        }

        h1 {
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 25px 0;
            font-weight: 500;
        }

        /* 🏹 ENVOLTORIO FLEX DEL PRECIO Y LA FLECHA DE TENDENCIA */
        .price-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 15px 0 25px 0;
        }

        .precio {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            transition: color 0.3s ease;
        }

        .tendencia-flecha {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .timestamp {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* 💰 SECCIÓN DEL BANNER PUBLICITARIO MONETIZADO */
        .ad-box {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(48, 54, 61, 0.4);
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <!-- 📢 CARTEL DE AUSPICIO PREMIUM (DIRECCIÓN OFICIAL INTEGRADA) -->
    <div class="sponsor-box">
        <a href="https://t.me/+K3X3kajhpa04YTAx" target="_blank">
            <div class="sponsor-btn">
                📢 Publicita tu memecoin aquí (Cobro diario) 🚀
            </div>
        </a>
    </div>

    <!-- Contenedor Principal Estilo Cristal -->
    <div class="container">
        <h1 id="app-title">Oráculo Wld On-Chain by Organic Labs</h1>
        
        <!-- Bloque Simétrico: Precio e Indicador Visual de Tendencia -->
        <div class="price-wrapper">
            <div id="precio-live" class="precio">--.--</div>
            <span id="tendencia-flecha" class="tendencia-flecha">➔</span>
        </div>

        <div id="clock-live" class="timestamp">📡 Sincronizando con el oráculo...</div>

        <!-- 🎯 ESPACIO DE PUBLICIDAD PAGADA (DIRECCIÓN TÉCNICA A-ADS INTEGRADA) -->
        <div class="ad-box">
            <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998; display: flex; justify-content: center;">
                <iframe data-aa='2457498' src='https://acceptable.a-ads.com/2457498/?'
                    style='border:0; padding:0; width:320px; height:50px; overflow:hidden; display:block; margin:auto;'></iframe>
            </div>
        </div>
    </div>

    <script>
        const precioElemento = document.getElementById('precio-live');
        const relojElemento = document.getElementById('clock-live');
        const tituloElemento = document.getElementById('app-title');

        let precioAnteriorBlockchain = null;

        // DICCIONARIO INTERNACIONAL DE TRADUCCIONES
        const traducciones = {
            es: {
                titulo: "Oráculo Wld On-Chain by Organic Labs",
                sincronizando: "📡 Sincronizando con el servidor en la nube...",
                verificado: "✅ Bloque verificado a las ",
                error: "Falla de enlace con la API REST."
            },
            en: {
                titulo: "Wld On-Chain Oracle by Organic Labs",
                sincronizando: "📡 Syncing with cloud server...",
                verificado: "✅ Block verified at ",
                error: "API REST connection failed."
            }
        };

        const sistemaIdioma = navigator.language || navigator.userLanguage;
        const idiomaActivo = sistemaIdioma.startsWith('es') ? 'es' : 'en';
        const lang = traducciones[idiomaActivo];

        tituloElemento.innerText = lang.titulo;
        relojElemento.innerText = lang.sincronizando;

        const refrescarPrecioDesdeBackend = async () => {
            try {
                // ✅ ENDPOINT REAL DE PRODUCCIÓN INTEGRADO
                const respuesta = await fetch('https://worldchain-price-oracle.vercel.app/api/precio');
                
                if (!respuesta.ok) {
                    throw new Error(`HTTP Error ${respuesta.status}`);
                }
                
                const datos = await respuesta.json();

                if (datos.success) {
                    const precioActual = datos.price;
                    
                    // Inyección de precio limpia y sobria
                    precioElemento.innerText = `$${precioActual.toFixed(6)}`;
                    precioElemento.style.color = 'var(--text-primary)';

                    const flechaElemento = document.getElementById('tendencia-flecha');
                    
                    // Cálculo dinámico de tendencia visual
                    if (precioAnteriorBlockchain !== null) {
                        if (precioActual > precioAnteriorBlockchain) {
                            flechaElemento.innerText = "▲";
                            flechaElemento.style.color = 'var(--brand-green)';
                            flechaElemento.style.transform = 'scale(1.1)';
                        } else if (precioActual < precioAnteriorBlockchain) {
                            flechaElemento.innerText = "▼";
                            flechaElemento.style.color = 'var(--brand-red)';
                            flechaElemento.style.transform = 'scale(1.1)';
                        }
                    }

                    precioAnteriorBlockchain = precioActual;

                    const horaLocal = new Date(datos.timestamp).toLocaleTimeString();
                    relojElemento.innerText = `${lang.verificado}${horaLocal}`;
                    relojElemento.style.color = 'var(--text-secondary)';
                } else {
                    throw new Error("Estado fallido.");
                }
            } catch (error) {
                precioElemento.innerText = "❌ ERR";
                precioElemento.style.color = 'var(--brand-red)';
                relojElemento.innerText = lang.error;
                relojElemento.style.color = 'var(--brand-red)';
            }
        };

        refrescarPrecioDesdeBackend();
        setInterval(refrescarPrecioDesdeBackend, 5000);
    </script>
</body>

</html>
